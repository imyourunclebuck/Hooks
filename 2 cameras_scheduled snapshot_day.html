<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Incubator Live Feed</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 10px;
            padding: 10px;
        }
        .grid-item {
            position: relative;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            text-align: center;
            margin-top: 20px;
        }
        #timestamp {
            font-size: 18px;
            text-align: center;
            margin-top: 10px;
        }
        button {
            margin: 5px;
            padding: 6px 12px;
            font-size: 14px;
        }
        input, select {
            margin: 5px;
            padding: 4px;
        }
    </style>
</head>
<body>
    <h1>Incubator Live Feed</h1>
    <div class="grid-container" id="cameraGrid">
        <div class="grid-item">
            <img id="cam1" src="http://192.168.2.43:5000/camera1" alt="Pi 1 Camera 1 Feed">
            <div class="controls">
                <button onclick="takeSnapshot('cam1')">Snapshot</button>
            </div>
        </div>
        <div class="grid-item">
            <img id="cam2" src="http://192.168.2.43:5000/camera2" alt="Pi 1 Camera 2 Feed">
            <div class="controls">
                <button onclick="takeSnapshot('cam2')">Snapshot</button>
            </div>
        </div>
        <div class="grid-item">
            <img id="cam3" src="http://192.168.2.158:5000/camera1" alt="Pi 2 Camera 1 Feed">
            <div class="controls">
                <button onclick="takeSnapshot('cam3')">Snapshot</button>
            </div>
        </div>
        <div class="grid-item">
            <img id="cam4" src="http://192.168.2.158:5000/camera2" alt="Pi 2 Camera 2 Feed">
            <div class="controls">
                <button onclick="takeSnapshot('cam4')">Snapshot</button>
            </div>
        </div>
    </div>

    <div class="controls">
        <label for="captureDateTime">Schedule Snapshot:</label>
        <input type="datetime-local" id="captureDateTime">
        <select id="cameraSelect">
            <option value="cam1">Camera 1</option>
            <option value="cam2">Camera 2</option>
            <option value="cam3">Camera 3</option>
            <option value="cam4">Camera 4</option>
        </select>
        <button onclick="scheduleSnapshot()">Schedule</button>
    </div>

    <div id="timestamp"></div>

    <canvas id="snapshotCanvas" style="display:none;"></canvas>

    <script>
        function updateTimestamp() {
            const now = new Date();
            document.getElementById("timestamp").textContent = `Current Time: ${now.toLocaleString()}`;
        }
        setInterval(updateTimestamp, 1000);
        updateTimestamp();

        function takeSnapshot(camId) {
            const img = document.getElementById(camId);
            const canvas = document.getElementById("snapshotCanvas");
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const link = document.createElement("a");
            link.download = `${camId}_snapshot_${Date.now()}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        function scheduleSnapshot() {
            const input = document.getElementById("captureDateTime").value;
            const camId = document.getElementById("cameraSelect").value;
            if (!input) return alert("Please select a valid date and time.");

            const target = new Date(input);
            const now = new Date();

            if (target <= now) return alert("Scheduled time must be in the future.");

            const delay = target.getTime() - now.getTime();
            alert(`Snapshot scheduled for ${target.toLocaleString()} on ${camId}`);

            setTimeout(() => {
                takeSnapshot(camId);
            }, delay);
        }
    </script>
</body>
</html>
