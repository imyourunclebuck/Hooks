<!DOCTYPE html>
<html>
<head>
    <title>Incubator Live Feed</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: auto auto; /* 2 columns */
            gap: 10px; /* Space between streams */
            padding: 10px;
        }
        .grid-item {
            width: 640px; /* Adjust as needed */
            height: 480px; /* Adjust as needed */
        }
        img {
            width: 100%;
            height: 100%;
        }
        #timestamp {
            font-size: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Incubator Live Feed</h1>
    <div class="grid-container">
        <div class="grid-item">
            <img src="http://192.168.3.56:5000/camera1" alt="Pi 1 Camera 1">
        </div>
        <div class="grid-item">
            <img src="http://192.168.3.56:5000/camera2" alt="Pi 1 Camera 2">
        </div>
        <div class="grid-item">
            <img src="http://192.168.2.103:5000/camera1" alt="Pi 2 Camera 1">
        </div>
        <div class="grid-item">
            <img src="http://192.168.2.103:5000/camera2" alt="Pi 2 Camera 2">
        </div>
    </div>
    <div id="timestamp"></div>
    <script>
        function updateTimestamp() {
            var now = new Date();
            var timestamp = now.toLocaleString();
            document.getElementById("timestamp").textContent = timestamp;
        }
        setInterval(updateTimestamp, 1000); // Update every 1 second
    </script>
</body>
</html>
