<html>
<head>
    <title>Multi-Camera Live Feed</title>
    <style>
        /* ... (Your existing CSS styles) ... */
    </style>
    <script>
        function refreshImage(imgElement) {
            let originalSrc = imgElement.src;
            let timestamp = new Date().getTime();
            imgElement.src = originalSrc.split('?')[0] + '?' + timestamp;
        }

        function toggleStream(imgElement) {
            imgElement.style.display = imgElement.style.display === "none" ? "block" : "none";
            imgElement.parentElement.querySelector('.control-button[onclick*="toggleStream"]').textContent = imgElement.style.display === "none" ? "Show" : "Hide";
        }

        function rotateImage(imgElement, degrees) {
            imgElement.style.transform = `rotate(${degrees}deg)`;
        }

        function resetImage(imgElement) {
            imgElement.style.transform = 'rotate(0deg)';
        }

        function setAutofocus(cameraIP, state) {
            fetch(`http://${cameraIP}:5000/autofocus?state=${state}`)
                .then(response => {
                    if (!response.ok) {
                        console.error(`Failed to set autofocus to ${state} on ${cameraIP}`);
                    }
                })
                .catch(error => {
                    console.error(`Error setting autofocus: ${error}`);
                });
        }
    window.onload = function() {
            let imgs = document.querySelectorAll('img');
            imgs.forEach(function(img) {
                img.style.display = "block";
                img.parentElement.querySelector('.control-button[onclick*="toggleStream"]').textContent = "Hide";
            });

        };

    </script>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item">
            <img id="cam1" src="http://192.168.2.43:5000/camera1" alt="Camera 1">
            <div class="camera-label">Camera 1 (192.168.2.43)</div>
            <div class="control-button" onclick="setAutofocus('192.168.2.43', 'on')">AF On</div>
            <div class="control-button" onclick="setAutofocus('192.168.2.43', 'off')">AF Off</div>
        </div>
        <div class="grid-item">
            <img id="cam2" src="http://192.168.2.43:5000/camera2" alt="Camera 2">
            <div class="camera-label">Camera 2 (192.168.2.43)</div>
            <div class="control-button" onclick="setAutofocus('192.168.2.43', 'on')">AF On</div>
            <div class="control-button" onclick="setAutofocus('192.168.2.43', 'off')">AF Off</div>
        </div>
        <div class="grid-item">
            <img id="cam3" src="http://192.168.2.103:5000/camera1" alt="Camera 3">
            <div class="camera-label">Camera 3 (192.168.2.103)</div>
            <div class="control-button" onclick="setAutofocus('192.168.2.103', 'on')">AF On</div>
            <div class="control-button" onclick="setAutofocus('192.168.2.103', 'off')">AF Off</div>
        </div>
        <div class="grid-item">
            <img id="cam4" src="http://192.168.2.103:5000/camera2" alt="Camera 4">
            <div class="camera-label">Camera 4 (192.168.2.103)</div>
            <div class="control-button" onclick="setAutofocus('192.168.2.103', 'on')">AF On</div>
            <div class="control-button" onclick="setAutofocus('192.168.2.103', 'off')">AF Off</div>
        </div>
    </div>
</body>
</html>
