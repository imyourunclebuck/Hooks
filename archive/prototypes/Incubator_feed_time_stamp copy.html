<!DOCTYPE html>
<html>
<head>
    <title>Multi-Camera Live Feed</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #64b5f6;
            text-align: center;
            margin: 20px 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(640px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1300px;
            width: 95%;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            background-color: #262626;
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .camera-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .control-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-left: 5px;
        }

        .control-button:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

    </style>
    <script>
        function refreshImage(imgElement) {
            let originalSrc = imgElement.src;
            let timestamp = new Date().getTime();
            imgElement.src = originalSrc.split('?')[0] + '?' + timestamp;
        }

        function toggleStream(imgElement) {
            imgElement.style.display = imgElement.style.display === "none" ? "block" : "none";
            imgElement.parentElement.querySelector('.control-button[onclick*="toggleStream"]').textContent = imgElement.style.display === "none" ? "Show" : "Hide";
        }

        function rotateImage(imgElement, degrees) {
            imgElement.style.transform = `rotate(${degrees}deg)`;
        }

        function resetImage(imgElement) {
            imgElement.style.transform = 'rotate(0deg)';
        }
        window.onload = function() {
          let imgs = document.querySelectorAll('img');
          imgs.forEach(function(img){
            img.style.display = "block";
            img.parentElement.querySelector('.control-button[onclick*="toggleStream"]').textContent = "Hide";
          });

        };
    </script>
</head>
<body>
    <h1>Multi-Camera Live Feed</h1>
    <div class="grid-container">
        <div class="grid-item">
            <img id="cam1" src="http://192.168.2.43:5000/camera1" alt="Camera 1">
            <div class="camera-label">Camera 1 (192.168.2.43)</div>
            <div class="control-button" onclick="refreshImage(document.getElementById('cam1'))">Refresh</div>
            <div class="control-button" onclick="toggleStream(document.getElementById('cam1'))">Hide</div>
            <div class="control-button" onclick="rotateImage(document.getElementById('cam1'), 90)">Rotate 90°</div>
            <div class="control-button" onclick="resetImage(document.getElementById('cam1'))">Reset</div>
        </div>
        <div class="grid-item">
            <img id="cam2" src="http://192.168.2.103:5000/camera1" alt="Camera 2">
            <div class="camera-label">Camera 2 (192.168.2.103)</div>
            <div class="control-button" onclick="refreshImage(document.getElementById('cam2'))">Refresh</div>
            <div class="control-button" onclick="toggleStream(document.getElementById('cam2'))">Hide</div>
            <div class="control-button" onclick="rotateImage(document.getElementById('cam2'), 180)">Rotate 180°</div>
            <div class="control-button" onclick="resetImage(document.getElementById('cam2'))">Reset</div>
        </div>
        <div class="grid-item">
            <img id="cam3" src="http://192.168.3.57:5000/camera1" alt="Camera 3">
            <div class="camera-label">Camera 3 (192.168.3.57)</div>
            <div class="control-button" onclick="refreshImage(document.getElementById('cam3'))">Refresh</div>
            <div class="control-button" onclick="toggleStream(document.getElementById('cam3'))">Hide</div>
            <div class="control-button" onclick="rotateImage(document.getElementById('cam3'), 270)">Rotate 270°</div>
            <div class="control-button" onclick="resetImage(document.getElementById('cam3'))">Reset</div>
        </div>
        <div class="grid-item">
            <img id="cam4" src="http://192.168.3.118:5000/camera1" alt="Camera 4">
            <div class="camera-label">Camera 4 (192.168.3.118)</div>
            <div class="control-button" onclick="refreshImage(document.getElementById('cam4'))">Refresh</div>
            <div class="control-button" onclick="toggleStream(document.getElementById('cam4'))">Hide</div>
            <div class="control-button" onclick="rotateImage(document.getElementById('cam4'), 0)">Rotate 0°</div>
            <div class.control-button" onclick="resetImage(document.getElementById('cam4'))">Reset</div>
        </div>
        <div class="grid-item">
            <img id="cam5" src="http://192.168.3.56:5000/camera1" alt="Camera 5">
            <div class="camera-label">Camera 5 (192.168.3.56)</div>
            <div class="control-button" onclick="refreshImage(document.getElementById('cam5'))">Refresh</div>
            <div class="control-button" onclick="toggleStream(document.getElementById('cam5'))">Hide</div>
            <div class="control-button" onclick="rotateImage(document.getElementById('cam5'), 0)">Rotate 0°</div>
            <div class="control-button" onclick="resetImage(document.getElementById('cam5'))">Reset</div>
        </div>
    </div>
</body>
</html>
