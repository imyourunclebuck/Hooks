<!DOCTYPE html>
<html>
<head>
    <title>Incubator Live Feed</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; /* Dark background for modern look */
            color: #e0e0e0; /* Light text color */
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #64b5f6; /* Accent color for heading */
            text-align: center;
            margin: 20px 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(640px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1300px;
            width: 95%;
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            background-color: #262626; /* Darker background for grid items */
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .camera-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        .control-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: background-color 0.3s ease; /* Smooth hover effect */
        }

        .control-button:hover {
            background-color: rgba(0, 0, 0, 0.9);
        }

        #weather-container, #time-container {
            background-color: #262626;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        #weather-container h2, #time-container h2 {
            color: #64b5f6;
            margin-bottom: 10px;
        }
    </style>
    <script>
        function refreshImage(imgElement) {
            let originalSrc = imgElement.src;
            let timestamp = new Date().getTime();
            imgElement.src = originalSrc.split('?')[0] + '?' + timestamp;
        }

        function toggleStream(imgElement) {
            if (imgElement.style.display === "none") {
                imgElement.style.display = "block";
                imgElement.parentElement.querySelector('.control-button').textContent = "Hide";
            } else {
                imgElement.style.display = "none";
                imgElement.parentElement.querySelector('.control-button').textContent = "Show";
            }
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('time-display').textContent = timeString;
        }

        function fetchWeather() {
            const apiKey = 'YOUR_OPENWEATHERMAP_API_KEY'; // Replace with your API key
            const city = 'YourCity'; // Replace with your city
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const temperature = data.main.temp;
                    const description = data.weather[0].description;
                    document.getElementById('weather-display').textContent = `Temperature: ${temperature}°C, ${description}`;
                })
                .catch(error => {
                    console.error('Error fetching weather:', error);
                    document.getElementById('weather-display').textContent = 'Weather data unavailable.';
                });
        }

        window.onload = function() {
            updateTime();
            setInterval(updateTime, 1000); // Update time every second
            fetchWeather();
        };
    </script>
</head>
<body>
    <h1>Incubator Live Feed</h1>

    <div id="time-container">
        <h2>Local Time</h2>
        <div id="time-display"></div>
    </div>

    <div id="weather-container">
        <h2>Local Weather</h2>
        <div id="weather-display"></div>
    </div>

    <div class="grid-container">
        <div class="grid-item">
            <img id="cam1-1" src="http://192.168.3.56:5000/camera1" alt="Pi 1 Camera 1">
            <div class="camera-label">Pi 1 Camera 1</div>
            <div class="control-button" onclick="refreshImage(document.getElementById('cam1-1'))">Refresh</div>
            <div class="control-button" onclick="toggleStream(document.getElementById('cam1-1'))">Hide</div>
        </div>
        <div class="grid-item">
            <img id="cam1-2" src="http://192.168.3.56:5000/camera2" alt="Pi 1 Camera 2">
            <div class="camera-label">Pi 1 Camera 2</div>
            <div class="control-button" onclick="refreshImage(document.getElementById('cam1-2'))">Refresh</div>
            <div class="control-button" onclick="toggleStream(document.getElementById('cam1-2'))">Hide</div>
        </div>
        <div class="grid-item">
            <img id="cam2-1" src="http://192.168.2.103:5000/camera1" alt="Pi 2 Camera 1">
            <div class="camera-label">Pi 2 Camera 1</div>
            <div class="control-button" onclick="refreshImage(document.getElementById('cam2-1'))">Refresh</div>
            <div class="control-button" onclick="toggleStream(document.getElementById('cam2-1'))">Hide</div>
        </div>
    </div>
</body>
</html>
