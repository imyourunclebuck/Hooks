<!DOCTYPE html>
<html>
<head>
    <title>Incubator Live Feed</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            text-align: center;
            margin: 20px 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(640px, 1fr)); /* Responsive grid */
            gap: 20px;
            padding: 20px;
            max-width: 1300px; /* Limit the width for larger screens */
            width: 95%; /* Make it responsive */
        }

        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        img {
            width: 100%;
            height: auto;
            display: block;
        }

        .camera-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        /* Optional: Add a loading indicator */
        .grid-item::before {
            content: "Loading...";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-style: italic;
            z-index: 1;
        }

        /* Optional: Hide loading after the image loads */
        img.loaded + .grid-item::before {
            display: none;
        }

    </style>
    <script>
        function imageLoaded(img) {
            img.classList.add('loaded');
        }
    </script>
</head>
<body>
    <h1>Incubator Live Feed</h1>
    <div class="grid-container">
        <div class="grid-item">
            <img src="http://192.168.3.56:5000/camera1" alt="Pi 1 Camera 1" onload="imageLoaded(this)">
            <div class="camera-label">Pi 1 Camera 1</div>
        </div>
        <div class="grid-item">
            <img src="http://192.168.3.56:5000/camera2" alt="Pi 1 Camera 2" onload="imageLoaded(this)">
            <div class="camera-label">Pi 1 Camera 2</div>
        </div>
        <div class="grid-item">
            <img src="http://192.168.2.103:5000/camera1" alt="Pi 2 Camera 1" onload="imageLoaded(this)">
            <div class="camera-label">Pi 2 Camera 1</div>
        </div>

    </div>
</body>
</html>
